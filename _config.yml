title: "Undergraduate Research Seminar in Mathematics"
short_title: "URSM"
tagline: "A weekly seminar bringing cutting-edge QMUL mathematics research to an undergraduate audience."
university: "Queen Mary University of London"
department: "School of Mathematical Sciences"
term: "Semester 1 2026"
schedule_day: "Wednesday"
schedule_time: &schedule_time "15:00–16:00"
schedule_room: &schedule_room "Mathematical Sciences Building, MB-503"   # ← replace with your actual room

# --- Host-specific settings -------------------------------------------
# These are the ONLY two lines you should need to touch when you move
# hosts (e.g. from a personal GitHub.com Pages site to QMUL's GitHub
# Enterprise instance, or vice versa).
#
#   Hosting at a user/org root domain, or a custom domain:  url: "https://your-domain", baseurl: ""
#   Hosting as a project site (e.g. username.github.io/repo):  url: "https://username.github.io", baseurl: "/repo-name"
#
url: "https://flavio-gualtieri.github.io"
baseurl: "/ugrs-26-27"
# -----------------------------------------------------------------------

# Contact / mailing list — placeholders, see README for what to replace these with
contact_email: "f.d.gualtieri@qmul.ac.uk"
mailing_list_url: "https://qmlists.qmul.ac.uk/sympa/subscribe/ug-research-seminar@qmlists.qmul.ac.uk"

collections:
  talks:
    output: true
    permalink: /talks/:path/

defaults:
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "talk"
      time: *schedule_time
      room: *schedule_room
  - scope:
      path: ""
    values:
      layout: "default"

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
