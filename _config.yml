title: "Undergraduate Research Seminar in Mathematics"
short_title: "UGRS"
tagline: "A weekly seminar bringing cutting-edge QMUL mathematics research to an undergraduate audience."
university: "Queen Mary University of London"
department: "School of Mathematical Sciences"
term: "Semester 1 2026"
schedule_day: "Friday"
schedule_time: &schedule_time "16:00–17:30"
schedule_room: &schedule_room "Mathematical Sciences Building, MB-203"
venue_address: "Room MB-203, 2nd floor, School of Mathematical Sciences, Queen Mary University of London, Mile End Rd, London E1 4NS"
official_url: "https://www.qmul.ac.uk/maths/undergraduate/ugresearchseminar/ugresearchseminar"

# --- Host-specific settings -------------------------------------------
# These are the ONLY two lines you should need to touch when you move
# hosts (e.g. from a personal GitHub.com Pages site to QMUL's GitHub
# Enterprise instance, or vice versa).
#
#   Hosting at a user/org root domain, or a custom domain:  url: "https://your-domain", baseurl: ""
#   Hosting as a project site (e.g. username.github.io/repo):  url: "https://username.github.io", baseurl: "/repo-name"
#
url: "https://qmul-ugrs.github.io"
baseurl: "/ugrs-26-27"
# -----------------------------------------------------------------------

# Contact / mailing list
contact_email: "a.a.a.zaid@qmul.ac.uk"
# Microsoft Form (QMUL login required) — people enter their email, organisers add them manually.
mailing_list_url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=kfCdVhOw40CG7r2cueJYFFIK5k7pY0JFiVaznBALPJtUREwzS0dWS1ZNOE9EME5OUFRKSklMUzJHRC4u"

# Build pages for talks dated in the future (otherwise upcoming talks are listed but 404)
future: true

collections:
  talks:
    output: true
    permalink: /talks/:path/
  organisers:
    output: false   # data only — rendered into cards on about.html, no individual pages

defaults:
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "talk"
      time: *schedule_time
      room: *schedule_room
  - scope:
      path: ""
    values:
      layout: "default"

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
